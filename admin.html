<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración Acta Cero</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
    <style>
        .oculto {
            display: none;
        }

        .campo-firma-acciones {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .campo-firma-acciones button {
            font-size: 13px;
            padding: 6px 12px;
        }

        .firma-preview {
            display: block;
            max-width: 180px;
            max-height: 60px;
            margin-top: 8px;
            border: 1px dashed #999;
            padding: 4px;
            background:
                linear-gradient(45deg, #eee 25%, transparent 25%) -4px 0/ 8px 8px,
                linear-gradient(-45deg, #eee 25%, transparent 25%) -4px 0/ 8px 8px,
                linear-gradient(45deg, transparent 75%, #eee 75%) -4px 0/ 8px 8px,
                linear-gradient(-45deg, transparent 75%, #eee 75%) -4px 0/ 8px 8px;
        }

        .modal-firma {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-firma.oculto {
            display: none;
        }

        .modal-firma-contenido {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            max-width: 95vw;
        }

        .modal-firma-contenido h3 {
            margin-top: 0;
        }

        #canvasFirma {
            display: block;
            width: min(600px, 90vw);
            height: 250px;
            border: 1px dashed #999;
            touch-action: none;
            background:
                linear-gradient(45deg, #f2f2f2 25%, transparent 25%) 0 0/ 10px 10px,
                linear-gradient(-45deg, #f2f2f2 25%, transparent 25%) 0 0/ 10px 10px,
                linear-gradient(45deg, transparent 75%, #f2f2f2 75%) 0 0/ 10px 10px,
                linear-gradient(-45deg, transparent 75%, #f2f2f2 75%) 0 0/ 10px 10px;
            cursor: crosshair;
        }

        .modal-firma-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }
        .firma-preview-vacia {
            opacity: 0.85;
        }

        /* ---------- Técnicos: cuadrícula de tarjetas ---------- */
        #listaTecnicos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }

        .card-admin {
            border: 1px solid #e2e5ea;
            border-radius: 10px;
            padding: 13px 15px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(20, 30, 50, 0.06);
            transition: box-shadow .15s ease, transform .15s ease;
        }

        .card-admin:hover {
            box-shadow: 0 5px 14px rgba(20, 30, 50, 0.12);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-header h3 {
            margin: 0;
            font-size: 15px;
            line-height: 1.3;
        }

        .card-admin .btn-peligro {
            font-size: 12px;
            padding: 4px 9px;
            flex: 0 0 auto;
        }

        .card-linea {
            font-size: 13px;
            color: #444;
            margin-top: 2px;
        }

        .card-firma-thumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px dashed #e5e7eb;
        }

        .card-firma-thumb img {
            width: 76px;
            height: 32px;
            object-fit: contain;
            border: 1px solid #dde1e6;
            border-radius: 5px;
            background: #fafafa;
            flex: 0 0 auto;
        }

        .estado-firma {
            font-size: 11.5px;
        }

        .badge-si {
            color: #157347;
            font-weight: 600;
        }

        .badge-no {
            color: #97999e;
        }

        /* ---------- Listas maestro-detalle: subestaciones / contratas ---------- */
        .lista-scroll {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-lista {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            border: none;
            border-left: 3px solid transparent;
            background: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            color: #222;
            transition: background .12s ease, border-color .12s ease;
        }

        .item-lista:hover {
            background: #f2f6fb;
        }

        .item-lista.activo {
            background: #e8f0fb;
            border-left-color: #1f6fb2;
            font-weight: 600;
        }

        .avatar-inicial {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #1f6fb2;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        /* ---------- Chips: parques / posiciones ---------- */
        .chips-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 8px 0 14px 0;
        }

        .chip-item {
            display: flex;
            align-items: center;
            gap: 7px;
            background: #eef2f6;
            border: 1px solid #dde3ea;
            border-radius: 999px;
            padding: 5px 6px 5px 13px;
            font-size: 13px;
            color: #2b2f34;
        }

        .chip-item .btn-mini {
            width: 19px;
            height: 19px;
            line-height: 17px;
            padding: 0;
            border-radius: 50%;
            text-align: center;
            font-size: 12px;
        }

        /* ---------- Tarjetas de representante (mas info que un chip) ---------- */
        .reps-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 8px 0 14px 0;
        }

        .rep-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e2e5ea;
            border-radius: 8px;
            padding: 7px 10px;
            background: #fff;
        }

        .rep-card img {
            width: 58px;
            height: 26px;
            object-fit: contain;
            border: 1px solid #dde1e6;
            border-radius: 4px;
            background: #fafafa;
            flex: 0 0 auto;
        }

        .rep-info {
            flex: 1 1 auto;
            min-width: 0;
        }

        .rep-nombre {
            font-size: 13.5px;
            font-weight: 600;
            color: #222;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rep-acciones {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Administración</h1>

        <div class="acciones-superiores">
            <a class="btn-secundario" href="/">Ir al formulario</a>
        </div>

        <section>
            <h2>Configuración</h2>

            <div class="bloque-config">
                <h3>Unidad solicitante</h3>
                <div class="fila-admin">
                    <input id="cfgUnidad" placeholder="Unidad solicitante">
                </div>
            </div>

            <div class="bloque-config">
                <h3>Jefe de Instalación</h3>
                <div class="fila-admin">
                    <input id="cfgJefeNombre" placeholder="Nombre del jefe">
                    <input id="cfgJefeFirma" placeholder="Ruta firma jefe (ej: img/firma-jefe.png)">
                </div>
                <div class="campo-firma-acciones">
                    <button type="button" class="btn-secundario" onclick="document.getElementById('cfgJefeFirmaArchivo').click()">Subir imagen</button>
                    <input type="file" id="cfgJefeFirmaArchivo" accept="image/png,image/jpeg" hidden onchange="subirArchivoFirma(this, 'cfgJefeFirma')">
                    <button type="button" class="btn-secundario" onclick="abrirModalFirma('cfgJefeFirma')">Firmar con lápiz</button>
                </div>
                <img id="cfgJefeFirmaPreview" class="firma-preview" alt="Vista previa firma jefe">
                <div class="fila-check">
                    <label class="check-label">
                        <input type="checkbox" id="cfgJefeUsarFirma">
                        Usar firma automática del jefe
                    </label>
                </div>
            </div>

            <div class="bloque-config">
                <h3>Firmante P.O. del Jefe de la Instalación</h3>
                <div class="fila-admin">
                    <input id="cfgFirmantePONombre" placeholder="Nombre del firmante P.O.">
                    <input id="cfgFirmantePOFirma" placeholder="Ruta firma (ej: img/firma-arturo.png)">
                </div>
                <div class="campo-firma-acciones">
                    <button type="button" class="btn-secundario" onclick="document.getElementById('cfgFirmantePOFirmaArchivo').click()">Subir imagen</button>
                    <input type="file" id="cfgFirmantePOFirmaArchivo" accept="image/png,image/jpeg" hidden onchange="subirArchivoFirma(this, 'cfgFirmantePOFirma')">
                    <button type="button" class="btn-secundario" onclick="abrirModalFirma('cfgFirmantePOFirma')">Firmar con lápiz</button>
                </div>
                <img id="cfgFirmantePOFirmaPreview" class="firma-preview" alt="Vista previa firma firmante P.O.">
                <div class="fila-check">
                    <label class="check-label">
                        <input type="checkbox" id="cfgFirmantePOUsarFirma">
                        Usar firma automática del firmante P.O.
                    </label>
                </div>
            </div>

            <div class="fila-admin">
                <button type="button" onclick="guardarConfiguracion()">Guardar configuración</button>
            </div>
        </section>

        <section>
            <h2>Técnicos solicitantes</h2>

            <div class="fila-admin">
                <input id="nuevoTecnicoNombre" placeholder="Nombre del técnico">
                <input id="nuevoTecnicoArea" placeholder="Área">
                <input id="nuevoTecnicoFirma" placeholder="Ruta firma (ej: img/firma-arturo.png)">
            </div>

            <div class="campo-firma-acciones">
                <button type="button" class="btn-secundario" onclick="document.getElementById('nuevoTecnicoFirmaArchivo').click()">Subir imagen</button>
                <input type="file" id="nuevoTecnicoFirmaArchivo" accept="image/png,image/jpeg" hidden onchange="subirArchivoFirma(this, 'nuevoTecnicoFirma')">
                <button type="button" class="btn-secundario" onclick="abrirModalFirma('nuevoTecnicoFirma')">Firmar con lápiz</button>
            </div>
            <img id="nuevoTecnicoFirmaPreview" class="firma-preview" alt="Vista previa firma técnico">

            <div class="fila-check">
                <label class="check-label">
                    <input type="checkbox" id="nuevoTecnicoUsarFirma">
                    Usar firma automática
                </label>
            </div>

            <div class="fila-admin">
                <button type="button" onclick="crearTecnico()">Añadir técnico</button>
            </div>

            <div id="listaTecnicos"></div>
        </section>

        <section>
            <div class="cabecera-seccion">
                <h2>Subestaciones</h2>
                <div class="acciones-inline">
                    <input id="nuevaSubestacion" placeholder="Nueva subestación">
                    <button type="button" onclick="crearSubestacion()">Añadir</button>
                </div>
            </div>

            <div class="layout-master-detail">
                <div class="panel-lista">
                    <input id="filtroSubestaciones" placeholder="Buscar subestación..." oninput="renderSubestacionesLista()">
                    <div id="listaSubestaciones" class="lista-scroll"></div>
                </div>

                <div class="panel-detalle">
                    <div id="detalleSubestacion" class="detalle-vacio">
                        Selecciona una subestación para editarla.
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="cabecera-seccion">
                <h2>Contratistas</h2>
                <div class="acciones-inline">
                    <input id="nuevoContratista" placeholder="Nueva contrata">
                    <button type="button" onclick="crearContratista()">Añadir</button>
                </div>
            </div>

            <div class="layout-master-detail">
                <div class="panel-lista">
                    <input id="filtroContratistas" placeholder="Buscar contrata..." oninput="renderContratistasLista()">
                    <div id="listaContratistas" class="lista-scroll"></div>
                </div>

                <div class="panel-detalle">
                    <div id="detalleContratista" class="detalle-vacio">
                        Selecciona una contrata para editarla.
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="modalFirma" class="modal-firma oculto">
        <div class="modal-firma-contenido">
            <h3>Firmar con lápiz</h3>
            <canvas id="canvasFirma" width="600" height="250"></canvas>
            <div class="modal-firma-acciones">
                <button type="button" class="btn-secundario" onclick="borrarCanvasFirma()">Borrar</button>
                <button type="button" class="btn-secundario" onclick="cerrarModalFirma()">Cancelar</button>
                <button type="button" onclick="guardarFirmaCanvas()">Guardar firma</button>
            </div>
        </div>
    </div>
</body>
</html>
